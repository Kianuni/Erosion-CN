name: Sync Official AltStore Source

on:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: altstore-source-sync
  cancel-in-progress: false

jobs:
  sync-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate apps.json from GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/update_altstore_source.py
          python3 -c '
          import json
          doc = json.load(open("apps.json", encoding="utf-8"))
          app = doc["apps"][0]
          assert app["bundleIdentifier"] == "com.jbdotparty.Erosion"
          assert len(app["versions"]) >= 1
          assert app["versions"][0]["sha256"]
          assert "com.apple.security.application-groups" in app["appPermissions"]["entitlements"]
          print("Validated latest version:", app["version"], "versions count:", len(app["versions"]))
          '

      - name: Commit and push updated apps.json
        run: |
          if git diff --quiet apps.json; then
            echo "apps.json is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps.json
          git commit -m "chore(altstore): sync apps.json with latest GitHub Releases [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
